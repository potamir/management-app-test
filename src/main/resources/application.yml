spring:
  application:
    name: warehouse-inventory-mgt

  datasource:
    url: jdbc:h2:mem:warehousedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  error:
    include-message: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.warehouse.inventory: INFO
